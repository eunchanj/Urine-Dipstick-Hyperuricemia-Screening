# Conda environment for this repository. The package versions are those of requirements.txt: the environment recorded
# in the config.json of the retrained models (models/bestmodel_v5/config.json) plus the helper packages the scripts
# import (see requirements.txt for which pins were recorded and which were read from the interpreter afterwards).
# Python 3.13.5 as recorded.
name: urine-dipstick-uric
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - pip
  - pip:
      - -r requirements.txt
